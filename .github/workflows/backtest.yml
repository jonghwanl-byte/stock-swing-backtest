name: Weekly swing backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 22 * * 0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: src

  backtest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build point-in-time S&P 500 universe
        run: python scripts/build_sp500_universe.py --start 2015-01-01
      - name: Download adjusted daily prices
        run: python scripts/download_prices.py --start 2015-01-01
      - name: Run backtest
        run: python scripts/run_backtest.py --input data/prices.csv
      - uses: actions/upload-artifact@v4
        with:
          name: swing-backtest-results
          path: |
            outputs/
            data/sp500_membership.csv
          retention-days: 30
