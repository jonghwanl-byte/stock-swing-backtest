name: Weekly swing backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: src

  backtest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run when a price file is present
        shell: bash
        run: |
          if [ -f data/prices.csv ]; then
            python scripts/run_backtest.py --input data/prices.csv
          else
            echo "data/prices.csv not found; tests completed and backtest skipped."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('outputs/**') != '' }}
        with:
          name: swing-backtest-results
          path: outputs/
          retention-days: 30
