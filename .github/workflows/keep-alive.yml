name: Keep scheduled workflows alive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create an empty commit only after 50 inactive days
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          inactive_days=$(( (now - last_commit) / 86400 ))
          if [ "$inactive_days" -lt 50 ]; then
            echo "Only $inactive_days inactive days; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push
